# TortOS systems. One per line, in the order they appear on the shelf.
#
#   sys | display name | Roms/ folder | core | tag | card art | accent | extensions | disc bios
#
# tag keys the per-system DISPLAY MODE and the favorites list. It is not what
# saves and states hang off - states are keyed on the FOLDER and .srm files sit
# flat in Saves/ named after the ROM, both checked in the code on 2026-09-01.
# system_cfg declares tag[8], so up to seven characters; the nine original rows
# all happen to be three or fewer, which is not a rule - NGPC is four.
# Changing a tag orphans that system's favorites and its display-mode line.
#
# The Roms/ folder is THE NAME PEOPLE USE for the machine, not an abbreviation.
# NES and SNES look like exceptions and are not - those ARE the everyday names,
# while nobody says "Nintendo Entertainment System" and nobody says "NGP".
# The short form already has a home: it is the tag field. A folder that repeats
# the tag leaves the readable name with nowhere to live, which is how this file
# briefly carried Roms/NGPC.
#
# The folder is also load-bearing rather than cosmetic - save states hang off it
# and so does the box art table in artscrape.c - so it is worth getting right
# early and cheap rather than late.
#
# extensions is the allow-list for that folder. Without it a save file or a
# stray text file next to a ROM shows up on the shelf as a game.
#
# disc bios is the firmware a DISC image on that shelf needs, looked for in
# Bios/. It is checked only for disc images: a PC Engine HuCard runs with no
# System Card, so declaring syscard3.pce for the whole shelf would refuse every
# cartridge on it. Empty for a system whose games need no firmware.
#
# Ordered by US release date, and the 1989 trio is why that is worth stating
# rather than saying "release order": Game Boy 31 Jul, Genesis 14 Aug and
# TurboGrafx-16 29 Aug are three weeks apart and this file had the first two the
# wrong way round until 2026-09-01.
#
#   NES            Oct 1985      SNES             Aug 1991
#   Master System  Sep 1986      Neo Geo Pocket   Oct 1998  (JP)
#   Game Boy       Jul 1989      Game Boy Color   Nov 1998
#   Genesis        Aug 1989      NGP Color        Aug 1999
#   TurboGrafx-16  Aug 1989      Game Boy Advance Jun 2001
#   Game Gear      Apr 1991
#
# The mono Neo Geo Pocket NEVER SHIPPED IN THE US - Japan only - so it sorts on
# its Japanese date instead, which puts it three weeks ahead of the Game Boy
# Color that killed it. That is the one row not keyed on a US date, marked (JP)
# above so the exception is visible rather than inferred from a surprise.
# These dates are common knowledge, not measured here.
#
# Favorites is not in this file. The launcher prepends it as shelf 0 at runtime;
# it has no Roms/ folder, which is also why the art scraper skips it by name.
#
# The two Neo Geo Pockets are ONE core on TWO shelves. Splitting them is not
# pedantry: libretro keeps their box art in separate repos, so a mixed shelf can
# only ever fetch art for half of it. Mono cartridges still run on Color
# hardware, so either shelf will play either game if you file it there.

# Accents ARE each card's own rule color, sampled not adjusted. They were
# brightened for glow once; that made six of nine disagree with the card the
# player is looking at, which is the one place the color has to be right.
sys|NES|NES|fceumm|NES|NES.png|C4443A|nes,fds,unf,unif,zip
