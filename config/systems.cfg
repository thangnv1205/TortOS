# Added 2026-11-06: systems needing cores NOT yet in TortOS/cores/.
# Fetch each core from libretro buildbot (linux/aarch64) into TortOS/cores/,
# then drop its card art PNG into TortOS/res/ and rebuild.
# Core names must match the .so filename prefix exactly.
#   Atari 2600  -> stella_libretro.so        extensions: a26,zip     tag: A2600
#   Atari 7800  -> prosystem_libretro.so     extensions: a78,zip     tag: A7800
#   MAME        -> mame2003_libretro.so      extensions: zip         tag: MAME
#   NeoGeo      -> fbneo_libretro.so         extensions: zip         tag: NEOGEO
#   N64         -> mupen64plus_libretro.so   extensions: n64,v64,z64 tag: N64
#   Dreamcast   -> flycast_libretro.so       extensions: cdi,chd,gdi tag: DC
#   Sega Saturn -> yabause_libretro.so       extensions: cue,iso,ccd tag: SATURN
#   PSP         -> ppsspp_libretro.so        extensions: cso,iso,pbp tag: PSP
#
# Tag is max 7 chars (tag[8]). Art PNG named exactly <TAG>.png in res/.
# Disc-bios column only for disc systems; leave empty for cartridges.
# Fixed 2026-11-07 (Claude): the eight lines here had an extra "Roms/..." column,
# which shifted every field after it, so the parser dropped all eight.
# Columns: sys|name|Roms folder|core|tag|card art|accent|extensions|disc bios
